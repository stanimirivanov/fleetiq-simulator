name: Simulator verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --allow-scripts=pnpm@12.5.1 --strict-allow-scripts
      - run: pnpm install --frozen-lockfile && pnpm --dir harness install --frozen-lockfile --ignore-scripts
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/fleetiq-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fleetiq-tools" gitleaks
          echo "$RUNNER_TEMP/fleetiq-tools" >> "$GITHUB_PATH"
      - name: Check verification floor from the PR base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:harness/src/verification/floor.mjs" 2>/dev/null; then
            git show "$BASE_SHA:harness/src/verification/floor.mjs" | node --input-type=module - "$BASE_SHA"
          elif git cat-file -e "$BASE_SHA:tools/floor.mjs" 2>/dev/null; then
            git show "$BASE_SHA:tools/floor.mjs" | node --input-type=module - "$BASE_SHA"
          elif test "$BASE_SHA" = 2f86fa158e7996070257f61d6cdfeb948a041b1b; then
            # One-time introduction against the reviewed H7 merge only.
            node harness/src/verification/floor.mjs "$BASE_SHA"
          else
            echo 'verification-floor: trusted base checker missing; restore baseline history.' >&2
            exit 1
          fi
      - name: Run the canonical verification harness
        run: pnpm check
