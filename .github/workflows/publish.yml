name: Publish immutable simulator image
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact current merged main SHA (blank selects dispatch main)
        required: false
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --allow-scripts=pnpm@12.5.1 --strict-allow-scripts
      - run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/fleetiq-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fleetiq-tools" gitleaks
          echo "$RUNNER_TEMP/fleetiq-tools" >> "$GITHUB_PATH"
      - name: Install checksum-pinned Trivy
        shell: bash
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/fleetiq-tools" trivy
      - name: Admit current reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.source_revision }}
        run: node tools/image-publish.mjs source
      - name: Verify source
        run: pnpm check
      - name: Qualify restricted image
        run: pnpm image:qualify
      - name: Publish and verify immutable registry bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.source_revision }}
        run: node tools/image-publish.mjs publish
